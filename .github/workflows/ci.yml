name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# The circuit installs Proxmox's kernel and reboots into it, which the
# containers other circuits test in can't do, so e2e applies it to a Debian
# 13 VM under KVM instead: examples/local starts one.
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the examples
        run: |
          for dir in examples/single-node examples/lxc examples/local; do
            (cd "$dir" && conn3x init -backend=false && conn3x validate)
          done

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    name: e2e (debian13)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: *gh
        run: *install
      # Hosted Ubuntu runners have KVM, but /dev/kvm isn't open to the
      # runner user until a udev rule says so.
      - name: Install QEMU and open up KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Start the Debian 13 VM
        working-directory: examples/local
        run: ./up.sh
      # Install with the last release first, then apply this checkout over
      # it, as anyone moving to a new release does.
      - name: Apply the previous release, v0.1.1
        working-directory: examples/local
        run: |
          sed -i 's|source = "../.."|source = "github.com/conn3xorg/circuit-proxmox?ref=v0.1.1"|' main.tf
          conn3x init
          conn3x apply -auto-approve
      - name: Upgrade to this checkout, apply, then plan again with no changes
        working-directory: examples/local
        run: |
          git checkout -- main.tf
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # An API token made on the node, used from the runner through the
      # forwarded port, the way a client or the bpg/proxmox provider would.
      - name: Make an API token
        working-directory: examples/local
        run: |
          secret=$(ssh -o UserKnownHostsFile=known_hosts -i id_ed25519 -p 2222 root@127.0.0.1 \
            "pveum user token add root@pam ci --privsep 0 --output-format json" | jq -r .value)
          echo "::add-mask::$secret"
          echo "PVE_TOKEN=root@pam!ci=$secret" >> "$GITHUB_ENV"
      - name: Use the API
        run: &use |
          api() { curl -ksSf --retry 30 --retry-all-errors --retry-delay 2 -H "Authorization: PVEAPIToken=$PVE_TOKEN" "https://127.0.0.1:8006/api2/json$1"; }
          api /version | jq -e '.data.release | startswith("9.")'
          # pvestatd reports the node a few seconds after boot.
          for i in $(seq 30); do
            api /nodes | jq -e '.data[] | select(.node == "pve1") | .status == "online"' >/dev/null && break
            [ "$i" -lt 30 ] || { echo "pve1 never showed as online." >&2; exit 1; }
            sleep 2
          done
          api /nodes/pve1/status | jq -e '.data.kversion | test("-pve")'
          curl -ksSf -o /dev/null https://127.0.0.1:8006/
      # SDN writes the VNet to /etc/network/interfaces.d/sdn. Its bridge only
      # comes up if /etc/network/interfaces sources that directory and
      # ifreload works, which on a cloud image the circuit has to arrange.
      - name: Create an SDN zone and VNet, and see its bridge come up
        working-directory: examples/local
        run: |
          ssh -o UserKnownHostsFile=known_hosts -i id_ed25519 -p 2222 root@127.0.0.1 sh -eu <<'EOF'
          pvesh create /cluster/sdn/zones --zone ci --type simple
          pvesh create /cluster/sdn/vnets --vnet civnet --zone ci
          pvesh create /cluster/sdn/vnets/civnet/subnets --subnet 10.99.0.0/24 --type subnet --gateway 10.99.0.1
          pvesh set /cluster/sdn
          # The apply reloads the network in a task of its own, so ifreload
          # is retried until that task lets go.
          for i in $(seq 30); do
            grep -qs civnet /etc/network/interfaces.d/sdn && ifreload -a && ip -4 -o addr show dev civnet | grep -q ' 10\.99\.0\.1/24 ' && break
            [ "$i" -lt 30 ] || { echo "The VNet's bridge civnet never came up with 10.99.0.1." >&2; exit 1; }
            sleep 2
          done
          ip -o link show civnet | grep -q '[<,]UP[,>]'
          EOF
      - name: Reboot
        working-directory: examples/local
        run: |
          ssh -o UserKnownHostsFile=known_hosts -i id_ed25519 -p 2222 root@127.0.0.1 'systemctl reboot' || true
          sleep 10
          for i in $(seq 100); do
            ssh -q -o ConnectTimeout=5 -o UserKnownHostsFile=known_hosts -i id_ed25519 -p 2222 root@127.0.0.1 true && break
            [ "$i" -lt 100 ] || { echo "The VM didn't come back after the reboot." >&2; exit 1; }
            sleep 3
          done
      # The API first: it waits for pveproxy and pvestatd, which a plan
      # straight after boot would otherwise catch still starting.
      - name: Use the API after the reboot
        run: *use
      - name: See the VNet's bridge come up again after the reboot
        working-directory: examples/local
        run: |
          ssh -o UserKnownHostsFile=known_hosts -i id_ed25519 -p 2222 root@127.0.0.1 \
            "ip -4 -o addr show dev civnet | grep -q ' 10\.99\.0\.1/24 '"
      - name: Plan again after the reboot, with no changes
        working-directory: examples/local
        run: conn3x plan -detailed-exitcode
      - name: Show the VM's console and Proxmox's log
        if: failure()
        working-directory: examples/local
        run: |
          tail -n 100 serial.log || true
          ssh -o UserKnownHostsFile=known_hosts -i id_ed25519 -p 2222 root@127.0.0.1 'journalctl -b --no-pager -u pveproxy -u pvedaemon -u pve-cluster -u pvestatd -u networking | tail -n 100; cat /etc/network/interfaces /etc/network/interfaces.d/sdn; ip -br addr' || true
      - name: Clean up
        if: always()
        working-directory: examples/local
        run: ./down.sh
